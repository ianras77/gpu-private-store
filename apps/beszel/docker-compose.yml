services:
  beszel-agent:
    image: henrygd/beszel-agent-nvidia:0.18.7
    restart: unless-stopped
    network_mode: host
    cap_add:
    - SYS_RAWIO
    - SYS_ADMIN
    devices:
    - /dev/sda:/dev/sda
    - /dev/sdb:/dev/sdb
    - /dev/sdc:/dev/sdc
    - /dev/sdd:/dev/sdd
    - /dev/sde:/dev/sde
    - /dev/sdf:/dev/sdf
    - /dev/sdg:/dev/sdg
    - /dev/sdh:/dev/sdh
    - /dev/nvme0n1:/dev/nvme0n1
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ${APP_DATA_DIR}/app-data/beszel/named/beszel-agent:/var/lib/beszel-agent
    - /dev/dri:/dev/dri:ro
    - /:/host:ro
    - /proc:/host/proc:ro
    - /data:/extra-filesystems/data:ro
    - /backup:/extra-filesystems/backup:ro
    - /models:/extra-filesystems/models:ro
    - /models-fast:/extra-filesystems/models-fast:ro
    - /mnt/cannonball:/extra-filesystems/cannonball:ro
    environment:
      LISTEN: 45876
      FILESYSTEM: sda2__OS
      SYS_SENSORS: /host/sys/class/hwmon
      GPU_COLLECTOR: nvidia-smi
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
      KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID/AjramldH8szPTXSbodEZjkN5tLPRMsqzZobygYmKE'
      HUB_URL: https://monitor.rasies.com
      TOKEN: '90eb6b35-3111-46d7-b1c6-815e07b44ebc'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - utility
    x-runtipi:
      add_to_main_network: false
x-runtipi:
  schema_version: 2
