services:
  beszel-agent:
    image: henrygd/beszel-agent:0.18.7
    restart: unless-stopped
    cap_add:
    - SYS_RAWIO
    - SYS_ADMIN
    devices:
    - /dev/sda:/dev/sda
    - /dev/sdb:/dev/sdb
    - /dev/sdc:/dev/sdc
    - /dev/sdd:/dev/sdd
    - /dev/sde:/dev/sde
    - /dev/sdf:/dev/sdf
    - /dev/sdg:/dev/sdg
    - /dev/sdh:/dev/sdh
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ${APP_DATA_DIR}/app-data/beszel/named/beszel-agent:/var/lib/beszel-agent
    - /dev/dri:/dev/dri:ro
    - /:/host:ro
    - /proc:/host/proc:ro
    environment:
      LISTEN: 45876
      KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID/AjramldH8szPTXSbodEZjkN5tLPRMsqzZobygYmKE'
      HUB_URL: https://monitor.rasies.com
      TOKEN: '90eb6b35-3111-46d7-b1c6-815e07b44ebc'
    x-runtipi:
      is_main: true
      internal_port: 45876
x-runtipi:
  schema_version: 2

