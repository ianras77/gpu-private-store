services:
  openclaw-bridge:
    build: /app-repos/openclaw-bridge
    env_file:
    - /app-repos/openclaw-bridge/.env
    environment:
      APP_PERSISTENT_STORAGE: /var/lib/openclaw_bridge
    volumes:
    - ${APP_DATA_DIR}/app-data/openclaw-bridge/named/openclaw-bridge-data:/var/lib/openclaw_bridge
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health",
        timeout=5)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    image: runtipi-local-openclaw-bridge-openclaw-bridge:latest
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
