app:
  name: web-crack
  type: web+api
  runtime: mixed
services:
  - name: web
    port: 3204
    protocol: http
    purpose: "Primary web UI"
    health: "/"
  - name: api
    port: 3205
    protocol: http
    purpose: "Backend API"
    health: "/healthz"
  - name: db
    port: 3206
    protocol: tcp
    purpose: "Postgres"
  - name: redis
    port: 3207
    protocol: tcp
    purpose: "Redis"
notes:
  - "Contiguous app block: 3204-3211 (web/api + infra services)."
  - "Web/API runtime is split across subfolders (`web/`, `backend/`)."
env:
  required:
    - NODE_ENV
  optional:
    - PORT
