services:
  lickingvape-api:
    build: ${ROOT_FOLDER_HOST}/apps/${APP_STORE_ID}/web-lickingvape/repo/apps/api
    restart: unless-stopped
    pull_policy: build
    environment:
      DATABASE_URL: ${LICKINGVAPE_DATABASE_URL:-postgresql://lickingvape:lickingvape@lickingvape-postgres:5432/lickingvape}
      INTERNAL_TOOL_TOKEN: ${LICKINGVAPE_INTERNAL_TOOL_TOKEN:-change-me}
      ADMIN_TOKEN: ${LICKINGVAPE_ADMIN_TOKEN:-}
      PHONE_HASH_SECRET: ${LICKINGVAPE_PHONE_HASH_SECRET:-change-me}
      AUTH_SECRET: ${LICKINGVAPE_AUTH_SECRET:-change-me}
      SESSION_TTL_DAYS: ${LICKINGVAPE_SESSION_TTL_DAYS:-30}
      TWILIO_AUTH_TOKEN: ${LICKINGVAPE_TWILIO_AUTH_TOKEN:-}
      PUBLIC_BASE_URL: ${APP_PROTOCOL}://${APP_DOMAIN}
      WEB_ORIGIN: ${APP_PROTOCOL}://${APP_DOMAIN}
      ALLOW_PROFANITY: ${LICKINGVAPE_ALLOW_PROFANITY:-true}
      REQUIRE_ADMIN_REVIEW: ${LICKINGVAPE_REQUIRE_ADMIN_REVIEW:-false}
      MAX_SMS_PER_MINUTE: ${LICKINGVAPE_MAX_SMS_PER_MINUTE:-5}
      SEED_DEMO_CONTENT: ${LICKINGVAPE_SEED_DEMO_CONTENT:-true}
      WORLD_CONTEXT_QUERY_LIMIT: ${LICKINGVAPE_WORLD_CONTEXT_QUERY_LIMIT:-4}
      WORLD_CONTEXT_ITEMS_LIMIT: ${LICKINGVAPE_WORLD_CONTEXT_ITEMS_LIMIT:-4}
      WORLD_CHAT_CONTEXT_ITEMS: ${LICKINGVAPE_WORLD_CHAT_CONTEXT_ITEMS:-3}
    depends_on:
      lickingvape-postgres:
        condition: service_healthy
    ports:
      - ${LICKINGVAPE_API_PORT:-3196}:8000
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 10
    image: runtipi-local-web-lickingvape-api:latest

  lickingvape-cat:
    image: ghcr.io/cheshire-cat-ai/core:latest
    restart: unless-stopped
    environment:
      CCAT_METADATA_FILE: /data/metadata.json
      CAT_METADATA_PATH: /data/metadata.json
      INTERNAL_API_BASE: http://lickingvape-api:8000
      INTERNAL_TOOL_TOKEN: ${LICKINGVAPE_INTERNAL_TOOL_TOKEN:-change-me}
      OLLAMA_GENERAL_BASE_URL: ${LICKINGVAPE_OLLAMA_GENERAL_BASE_URL:-http://host.docker.internal:8844}
      OLLAMA_EMBED_BASE_URL: ${LICKINGVAPE_OLLAMA_EMBED_BASE_URL:-http://host.docker.internal:8844}
      OLLAMA_GENERAL_MODEL: ${LICKINGVAPE_OLLAMA_GENERAL_MODEL:-rassy-smart}
      OLLAMA_EMBED_MODEL: ${LICKINGVAPE_OLLAMA_EMBED_MODEL:-rassy-embed}
      CAT_OLLAMA_API_KEY: ${RASSYCODEX_API_KEY:-}
      EDITOR_WORLD_CONTEXT_QUERY_LIMIT: ${LICKINGVAPE_EDITOR_WORLD_CONTEXT_QUERY_LIMIT:-2}
      EDITOR_WORLD_CONTEXT_ITEMS_LIMIT: ${LICKINGVAPE_EDITOR_WORLD_CONTEXT_ITEMS_LIMIT:-3}
    volumes:
      - ${APP_DATA_DIR}/app-data/web-lickingvape/named/lickingvape-cat-data:/data
      - ${ROOT_FOLDER_HOST}/apps/${APP_STORE_ID}/web-lickingvape/repo/scripts/configure_cat_ollama.py:/app/cat/bootstrap/auto_configure_ollama.py:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - /bin/sh
      - -lc
      - python3 /app/cat/bootstrap/auto_configure_ollama.py || true; exec python3 -m cat.main
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1', timeout=5)
      interval: 20s
      timeout: 10s
      retries: 18
      start_period: 60s
    x-runtipi:
      add_to_main_network: true

  lickingvape-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lickingvape
      POSTGRES_PASSWORD: lickingvape
      POSTGRES_DB: lickingvape
    volumes:
      - ${APP_DATA_DIR}/app-data/web-lickingvape/named/lickingvape-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U lickingvape -d lickingvape
      interval: 10s
      timeout: 5s
      retries: 10

  lickingvape-web:
    build:
      context: ${ROOT_FOLDER_HOST}/apps/${APP_STORE_ID}/web-lickingvape/repo/apps/web
      args:
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${LICKINGVAPE_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}}
        NEXT_PUBLIC_UMAMI_DOMAINS: ${LICKINGVAPE_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-}}
    restart: unless-stopped
    pull_policy: build
    environment:
      API_PROXY_TARGET: http://lickingvape-api:8000
      NEXT_PUBLIC_API_BASE: ${LICKINGVAPE_PUBLIC_API_BASE:-/api}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${LICKINGVAPE_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}}
      NEXT_PUBLIC_UMAMI_DOMAINS: ${LICKINGVAPE_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-}}
      PORT: "3000"
    depends_on:
      lickingvape-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
    image: runtipi-local-web-lickingvape-web:latest
    x-runtipi:
      is_main: true
      internal_port: 3000

  lickingvape-worker:
    build: ${ROOT_FOLDER_HOST}/apps/${APP_STORE_ID}/web-lickingvape/repo/apps/worker
    restart: unless-stopped
    pull_policy: build
    environment:
      DATABASE_URL: ${LICKINGVAPE_DATABASE_URL:-postgresql://lickingvape:lickingvape@lickingvape-postgres:5432/lickingvape}
      CAT_REVIEW_ENDPOINT: ${LICKINGVAPE_CAT_REVIEW_ENDPOINT:-http://lickingvape-cat:80/custom/editor/review}
      CAT_API_KEY: ${RASSYCODEX_API_KEY:-${LICKINGVAPE_CAT_API_KEY:-}}
      CAT_USER_ID: ${LICKINGVAPE_CAT_USER_ID:-}
      CAT_INTERNAL_TOKEN: ${LICKINGVAPE_CAT_INTERNAL_TOKEN:-}
      CAT_DRAFT_ENDPOINT: ${LICKINGVAPE_CAT_DRAFT_ENDPOINT:-http://lickingvape-cat:80/custom/editor/draft}
      ALLOW_PROFANITY: ${LICKINGVAPE_ALLOW_PROFANITY:-true}
      REQUIRE_ADMIN_REVIEW: ${LICKINGVAPE_REQUIRE_ADMIN_REVIEW:-false}
      WORKER_POLL_SECONDS: ${LICKINGVAPE_WORKER_POLL_SECONDS:-10}
      WORKER_BATCH_SIZE: ${LICKINGVAPE_WORKER_BATCH_SIZE:-10}
      WORLD_INGEST_ENABLED: ${LICKINGVAPE_WORLD_INGEST_ENABLED:-true}
      WORLD_INGEST_INTERVAL_SECONDS: ${LICKINGVAPE_WORLD_INGEST_INTERVAL_SECONDS:-1800}
      WORLD_SEARCH_BASE_URL: ${LICKINGVAPE_WORLD_SEARCH_BASE_URL:-https://search.rasies.com/search}
      WORLD_SEARCH_LANGUAGE: ${LICKINGVAPE_WORLD_SEARCH_LANGUAGE:-en-US}
      WORLD_SEARCH_SAFESEARCH: ${LICKINGVAPE_WORLD_SEARCH_SAFESEARCH:-0}
      WORLD_SEARCH_RESULTS_LIMIT: ${LICKINGVAPE_WORLD_SEARCH_RESULTS_LIMIT:-6}
      WORLD_SEARCH_MAX_AGE_DAYS: ${LICKINGVAPE_WORLD_SEARCH_MAX_AGE_DAYS:-21}
      WORLD_SEARCH_QUERIES: ${LICKINGVAPE_WORLD_SEARCH_QUERIES:-}
      WORLD_CONTEXT_ITEMS_FOR_DRAFT: ${LICKINGVAPE_WORLD_CONTEXT_ITEMS_FOR_DRAFT:-4}
      WORLD_AUTOPUBLISH_ENABLED: ${LICKINGVAPE_WORLD_AUTOPUBLISH_ENABLED:-true}
      WORLD_AUTOPUBLISH_INTERVAL_SECONDS: ${LICKINGVAPE_WORLD_AUTOPUBLISH_INTERVAL_SECONDS:-14400}
      WORLD_AUTOPUBLISH_MAX_PER_DAY: ${LICKINGVAPE_WORLD_AUTOPUBLISH_MAX_PER_DAY:-3}
      WORLD_AUTOPUBLISH_STATUS: ${LICKINGVAPE_WORLD_AUTOPUBLISH_STATUS:-published}
      WORLD_AUTOPUBLISH_MAX_WORDS: ${LICKINGVAPE_WORLD_AUTOPUBLISH_MAX_WORDS:-150}
      WORLD_AUTOPUBLISH_DISPLAY_NAME: ${LICKINGVAPE_WORLD_AUTOPUBLISH_DISPLAY_NAME:-night desk}
    depends_on:
      lickingvape-postgres:
        condition: service_healthy
      lickingvape-api:
        condition: service_healthy
      lickingvape-cat:
        condition: service_healthy
    image: runtipi-local-web-lickingvape-worker:latest

x-runtipi:
  schema_version: 2
