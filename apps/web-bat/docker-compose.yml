x-bat-runtime-env: &bat-runtime-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://bat:bat_password_change_me@bat-postgres:5432/bat}
  REDIS_URL: ${REDIS_URL:-redis://bat-redis:6379/0}
  QDRANT_URL: ${QDRANT_URL:-http://bat-qdrant:6333}
  CHESHIRE_CAT_URL: ${CHESHIRE_CAT_URL:-http://bat-cheshire-cat:80}
  CHESHIRE_CAT_API_KEY: ${CHESHIRE_CAT_API_KEY:-change_me}
  SOCIAL_PUBLISHER_URL: ${SOCIAL_PUBLISHER_URL:-http://bat-social-publisher:8100}
  SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-https://search.rasies.com}
  LLM_API_URL: ${LLM_API_URL_CONTAINER:-${RASSYMIND_BASE_URL:-http://host.docker.internal:8844}/v1/chat/completions}
  LLM_API_KEY: ${RASSYMIND_API_KEY:-${LLM_API_KEY:-}}
  LLM_MODEL: ${LLM_MODEL_CONTAINER:-rassy-smart}
  LLM_CHALLENGER_MODEL: ${LLM_CHALLENGER_MODEL_CONTAINER:-rassy-smart}
  LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-180}
  LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-3}
  LLM_READINESS_INFERENCE_PROBE_ENABLED: ${LLM_READINESS_INFERENCE_PROBE_ENABLED:-true}
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
  OLLAMA_REPEAT_LAST_N: ${OLLAMA_REPEAT_LAST_N:-96}
  OLLAMA_REPEAT_PENALTY: ${OLLAMA_REPEAT_PENALTY:-1.12}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-15m}
  EMBEDDING_API_URL: ${EMBEDDING_API_URL_CONTAINER:-${RASSYMIND_BASE_URL:-http://host.docker.internal:8844}/v1/embeddings}
  EMBEDDING_API_KEY: ${RASSYMIND_API_KEY:-${EMBEDDING_API_KEY:-}}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL_CONTAINER:-rassy-embed}
  EMBEDDING_ALLOW_FALLBACK: ${EMBEDDING_ALLOW_FALLBACK:-false}
  EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-12}
  EMBEDDING_REQUEST_RETRIES: ${EMBEDDING_REQUEST_RETRIES:-1}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
  CAT_PRIMARY_ENABLED: ${CAT_PRIMARY_ENABLED:-false}
  CAT_SECONDARY_MEMORY_ENABLED: ${CAT_SECONDARY_MEMORY_ENABLED:-true}
  CAT_SECONDARY_MEMORY_MIN_QUALITY: ${CAT_SECONDARY_MEMORY_MIN_QUALITY:-4.8}
  CAT_SECONDARY_MEMORY_RECALL_LIMIT: ${CAT_SECONDARY_MEMORY_RECALL_LIMIT:-12}
  CAT_SECONDARY_MEMORY_MAX_CHARS: ${CAT_SECONDARY_MEMORY_MAX_CHARS:-2400}
  CAT_REQUEST_TIMEOUT_SECONDS: ${CAT_REQUEST_TIMEOUT_SECONDS:-45}
  CAT_HEALTH_TIMEOUT_SECONDS: ${CAT_HEALTH_TIMEOUT_SECONDS:-12}
  ENABLE_MANUAL_REVIEW: ${ENABLE_MANUAL_REVIEW:-true}
  AUTO_PUBLISH: ${AUTO_PUBLISH:-false}
  AUTO_PUBLISH_SOCIAL: ${AUTO_PUBLISH_SOCIAL:-false}
  DIRECT_PUBLISH_DEFAULT: ${DIRECT_PUBLISH_DEFAULT:-false}
  WORKER_CYCLE_MINUTES: ${WORKER_CYCLE_MINUTES:-15}
  WORKER_MIN_CYCLE_SECONDS: ${WORKER_MIN_CYCLE_SECONDS:-30}
  WORKER_MAX_CYCLE_SECONDS: ${WORKER_MAX_CYCLE_SECONDS:-7200}
  WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-9000}
  WORKER_HEARTBEAT_KEY: ${WORKER_HEARTBEAT_KEY:-bat:worker:heartbeat}
  PIPELINE_LOCK_TTL_SECONDS: ${PIPELINE_LOCK_TTL_SECONDS:-7200}
  PIPELINE_STALE_AFTER_SECONDS: ${PIPELINE_STALE_AFTER_SECONDS:-7200}
  RESEARCH_QUERY_CONCURRENCY: ${RESEARCH_QUERY_CONCURRENCY:-8}
  RESEARCH_X_QUERY_CONCURRENCY: ${RESEARCH_X_QUERY_CONCURRENCY:-4}
  ANALYSIS_THEME_CONCURRENCY: ${ANALYSIS_THEME_CONCURRENCY:-4}
  WRITER_THEME_CONCURRENCY: ${WRITER_THEME_CONCURRENCY:-2}
  SOCIAL_DISPATCH_CONCURRENCY: ${SOCIAL_DISPATCH_CONCURRENCY:-4}
  WRITER_THEME_TAKE_LIMIT: ${WRITER_THEME_TAKE_LIMIT:-12}
  QUEEN_CURATION_LIMIT: ${QUEEN_CURATION_LIMIT:-12}
  X_ENABLED: ${X_ENABLED:-false}
  X_DRY_RUN: ${X_DRY_RUN:-true}
  X_API_BASE_URL: ${X_API_BASE_URL:-https://api.x.com}
  X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
  X_ACCESS_TOKEN: ${X_ACCESS_TOKEN:-}
  X_SEARCH_MAX_RESULTS: ${X_SEARCH_MAX_RESULTS:-10}
  X_RESEARCH_ENABLED: ${X_RESEARCH_ENABLED:-false}
  RETRIEVAL_MAX_SOURCES: ${RETRIEVAL_MAX_SOURCES:-10}
  RETRIEVAL_MAX_THEMES: ${RETRIEVAL_MAX_THEMES:-6}
  RETRIEVAL_MAX_TRENDS: ${RETRIEVAL_MAX_TRENDS:-8}
  ANALYSIS_SOURCE_LIMIT: ${ANALYSIS_SOURCE_LIMIT:-10}
  ANALYSIS_THEME_LIMIT: ${ANALYSIS_THEME_LIMIT:-8}
  ANALYSIS_RECENT_EDITORIAL_LIMIT: ${ANALYSIS_RECENT_EDITORIAL_LIMIT:-16}
  ANALYSIS_MAX_BRIEFS: ${ANALYSIS_MAX_BRIEFS:-18}
  RETRIEVAL_MIN_QUALITY_SCORE: ${RETRIEVAL_MIN_QUALITY_SCORE:-4.6}
  CURRENT_NEWS_MIN_YEAR: ${CURRENT_NEWS_MIN_YEAR:-2026}
  CURRENT_NEWS_MAX_AGE_DAYS: ${CURRENT_NEWS_MAX_AGE_DAYS:-7}
  BACKLOG_PUBLISH_WINDOW_HOURS: ${BACKLOG_PUBLISH_WINDOW_HOURS:-120}
  DAILY_PUBLISH_TARGET: ${DAILY_PUBLISH_TARGET:-5}
  DAILY_PUBLISH_REWORK_MULTIPLIER: ${DAILY_PUBLISH_REWORK_MULTIPLIER:-3}
  EDITORIAL_REWORK_QUEUE_LIMIT: ${EDITORIAL_REWORK_QUEUE_LIMIT:-6}
  EDITORIAL_REWORK_MAX_ATTEMPTS: ${EDITORIAL_REWORK_MAX_ATTEMPTS:-4}
  EDITORIAL_REWORK_PASSES_PER_CYCLE: ${EDITORIAL_REWORK_PASSES_PER_CYCLE:-3}
  EDITORIAL_BACKLOG_PRUNE_LIMIT: ${EDITORIAL_BACKLOG_PRUNE_LIMIT:-500}
  GENERATION_MIN_GROUNDED_SOURCES: ${GENERATION_MIN_GROUNDED_SOURCES:-3}
  OUTBOUND_HTTP_MAX_CONNECTIONS: ${OUTBOUND_HTTP_MAX_CONNECTIONS:-40}
  OUTBOUND_HTTP_MAX_KEEPALIVE_CONNECTIONS: ${OUTBOUND_HTTP_MAX_KEEPALIVE_CONNECTIONS:-20}

x-bat-host-gateway: &bat-host-gateway
  - host.docker.internal:host-gateway

services:
  bat-api:
    build: ${RUNTIPI_APP_BUILD_ROOT:-${ROOT_FOLDER_HOST:-../..}/apps}/${APP_STORE_ID:-}/web-bat/apps/api
    environment:
      <<: *bat-runtime-env
    extra_hosts: *bat-host-gateway
    ports:
      - ${BAT_API_PORT:-8017}:8000
    depends_on:
      bat-postgres:
        condition: service_healthy
      bat-redis:
        condition: service_healthy
      bat-qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    image: runtipi-local-web-bat-api:latest
    networks:
      - default
      - tipi_main
    x-runtipi:
      add_to_main_network: true

  bat-cheshire-cat:
    image: ghcr.io/cheshire-cat-ai/core:latest
    environment:
      CCAT_DEBUG: "false"
      CAT_METADATA_PATH: /data/metadata.json
      CCAT_METADATA_FILE: /data/metadata.json
      CCAT_QDRANT_HOST: bat-qdrant
      CCAT_QDRANT_PORT: "6333"
      OLLAMA_GENERAL_BASE_URL: ${CAT_OLLAMA_GENERAL_BASE_URL:-${OLLAMA_GENERAL_BASE_URL_CONTAINER:-${RASSYMIND_BASE_URL:-http://host.docker.internal:8844}}}
      OLLAMA_EMBED_BASE_URL: ${CAT_OLLAMA_EMBED_BASE_URL:-${OLLAMA_EMBED_BASE_URL_CONTAINER:-${RASSYMIND_BASE_URL:-http://host.docker.internal:8844}}}
      OLLAMA_GENERAL_MODEL: ${CAT_OLLAMA_GENERAL_MODEL:-${OLLAMA_GENERAL_MODEL_CONTAINER:-rassy-smart}}
      OLLAMA_EMBED_MODEL: ${CAT_OLLAMA_EMBED_MODEL:-${OLLAMA_EMBED_MODEL_CONTAINER:-rassy-embed}}
      CAT_OLLAMA_API_KEY: ${RASSYMIND_API_KEY:-${CAT_OLLAMA_API_KEY:-}}
      LLM_API_KEY: ${RASSYMIND_API_KEY:-${LLM_API_KEY:-}}
    extra_hosts: *bat-host-gateway
    volumes:
      - ${APP_DATA_DIR:-./.docker-data}/app-data/web-bat/named/bat-cat-data:/data
      - ${ROOT_FOLDER_HOST:-../..}/apps/${APP_STORE_ID:-}/web-bat/infra/scripts/bootstrap_cat_ollama.py:/app/cat/bootstrap/bootstrap_cat_ollama.py:ro
    command:
      - /bin/sh
      - -lc
      - python3 /app/cat/bootstrap/bootstrap_cat_ollama.py || true; exec python3 -m cat.main
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1', timeout=5)
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    depends_on:
      bat-qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - tipi_main
    x-runtipi:
      add_to_main_network: true

  bat-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bat
      POSTGRES_USER: bat
      POSTGRES_PASSWORD: bat_password_change_me
    volumes:
      - ${APP_DATA_DIR:-./.docker-data}/app-data/web-bat/named/bat-postgres-data:/var/lib/postgresql/data
      - ${ROOT_FOLDER_HOST:-../..}/apps/${APP_STORE_ID:-}/web-bat/infra/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ${ROOT_FOLDER_HOST:-../..}/apps/${APP_STORE_ID:-}/web-bat/infra/sql/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - ${ROOT_FOLDER_HOST:-../..}/apps/${APP_STORE_ID:-}/web-bat/infra/sql/003_trend_observation_uniqueness.sql:/docker-entrypoint-initdb.d/003_trend_observation_uniqueness.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U bat -d bat
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  bat-qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes:
      - ${APP_DATA_DIR:-./.docker-data}/app-data/web-bat/named/bat-qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  bat-redis:
    image: redis:7
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  bat-social-publisher:
    build: ${RUNTIPI_APP_BUILD_ROOT:-${ROOT_FOLDER_HOST:-../..}/apps}/${APP_STORE_ID:-}/web-bat/apps/social-publisher
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    image: runtipi-local-web-bat-social-publisher:latest

  bat-web:
    build:
      context: ${RUNTIPI_APP_BUILD_ROOT:-${ROOT_FOLDER_HOST:-../..}/apps}/${APP_STORE_ID:-}/web-bat/apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${WEB_BAT_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}}
        NEXT_PUBLIC_UMAMI_DOMAINS: ${WEB_BAT_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-}}
    environment:
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://bat-api:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${WEB_BAT_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}}
      NEXT_PUBLIC_UMAMI_DOMAINS: ${WEB_BAT_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-}}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      bat-api:
        condition: service_healthy
    ports:
      - ${APP_PORT:-3197}:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    image: runtipi-local-web-bat-web:latest
    x-runtipi:
      is_main: true
      internal_port: 3000

  bat-worker:
    build: ${RUNTIPI_APP_BUILD_ROOT:-${ROOT_FOLDER_HOST:-../..}/apps}/${APP_STORE_ID:-}/web-bat/apps/api
    extra_hosts: *bat-host-gateway
    command:
      - python
      - -m
      - workers.main
    environment:
      <<: *bat-runtime-env
    depends_on:
      bat-postgres:
        condition: service_healthy
      bat-redis:
        condition: service_healthy
      bat-qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -m workers.healthcheck
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s
    restart: unless-stopped
    image: runtipi-local-web-bat-worker:latest
    networks:
      - default
      - tipi_main
    x-runtipi:
      add_to_main_network: true

networks:
  tipi_main:
    external: true
    name: runtipi_tipi_main_network

x-runtipi:
  schema_version: 2
