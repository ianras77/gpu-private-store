services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: jogmania
      POSTGRES_PASSWORD: jogmania
      POSTGRES_DB: jogmania
    ports:
      - "${JOGMANIA_DB_PORT:-5432}:5432"
    volumes:
      - jogmania_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${JOGMANIA_REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${JOGMANIA_MINIO_PORT:-9000}:9000"
      - "${JOGMANIA_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - jogmania_minio:/data

  api:
    image: jogmania-api
    restart: unless-stopped
    build:
      context: ./repo/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://jogmania:jogmania@postgres:5432/jogmania
      JWT_SECRET: change-me
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: jogmania-exports
      MINIO_PUBLIC_URL: "http://localhost:${JOGMANIA_MINIO_PORT:-9000}"
      MINIO_ENABLED: "true"
      CORS_ORIGINS: '["http://localhost:${JOGMANIA_WEB_PORT:-3000}","http://localhost:19006"]'
      ADVENTURE_LLM_URL: http://localai-lb:8080/v1/chat/completions
      ADVENTURE_LLM_MODEL: rassy-fast
      AUTH_COOKIE_SECURE: "false"
      PYTHONPATH: /app
    volumes:
      - ./repo/api:/app
    command: sh -c "alembic upgrade head && python -m app.scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${JOGMANIA_API_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - default
      - localai

  web:
    image: jogmania-web
    restart: unless-stopped
    build:
      context: ./repo
      dockerfile: infra/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:${JOGMANIA_API_PORT:-8000}"
    volumes:
      - ./repo:/repo
    command: sh -c "corepack enable && pnpm install && pnpm --filter @jogmania/web dev -p 3000"
    ports:
      - "${JOGMANIA_WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  jogmania_pg:
  jogmania_minio:

networks:
  localai:
    external: true
    name: localai_default
