services:
  airflow:
    image: apache/airflow:2.7.1-python3.10
    restart: always
    depends_on:
    - postgres
    networks:
    - llm-net
    ports:
    - 8071:8080
    volumes:
    - ${APP_DATA_DIR}/app-data/learning/named/airflow-dags:/opt/airflow/dags
    - ${APP_DATA_DIR}/app-data/learning/named/airflow-logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'True'
    command: "bash -c \"\n  airflow db migrate &&\n  airflow users create -u airflow\
      \ -p airflow -f Ian -l Rasmussen -r Admin -e ian@rasies.com &&\n  exec airflow\
      \ webserver\n\"\n"
  db_labelstudio:
    image: postgres:13
    restart: always
    networks:
    - llm-net
    volumes:
    - ${APP_DATA_DIR}/app-data/learning/named/db-labelstudio:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: labelstudio
      POSTGRES_PASSWORD: labelstudio
      POSTGRES_DB: labelstudio
  labelstudio:
    image: heartexlabs/label-studio:latest
    restart: always
    depends_on:
    - db_labelstudio
    networks:
    - llm-net
    ports:
    - 8082:8080
    volumes:
    - ${APP_DATA_DIR}/app-data/learning/named/labelstudio:/label-studio/data
    environment:
      DATABASE_URL: postgresql://labelstudio:labelstudio@db_labelstudio:5432/labelstudio
      LABEL_STUDIO_HOST: https://labelstudio.rasies.com
      CSRF_TRUSTED_ORIGINS: https://labelstudio.rasies.com
  minio:
    image: minio/minio:latest
    restart: always
    networks:
    - llm-net
    volumes:
    - ${APP_DATA_DIR}/app-data/learning/named/minio:/data
    environment:
      MINIO_ROOT_USER: learning
      MINIO_ROOT_PASSWORD: Mycobacteri@98
    command: server /data --console-address ":9001"
  mlflow:
    build: /app-repos/learning/mlflow
    restart: unless-stopped
    depends_on:
    - postgres
    networks:
    - llm-net
    ports:
    - 5000:5000
    volumes:
    - ${APP_DATA_DIR}/app-data/learning/named/mlflow:/mlflow
    - ${APP_DATA_DIR}/app-data/learning/bind/mlflow-basic-auth-ini:/etc/mlflow/basic_auth.ini:ro
    environment:
      MLFLOW_AUTH_CONFIG_PATH: /etc/mlflow/basic_auth.ini
      MLFLOW_FLASK_SERVER_SECRET_KEY: Mycobacteri@98
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
      MLFLOW_ARTIFACT_ROOT: /mlflow
    entrypoint:
    - mlflow
    command:
    - server
    - --host=0.0.0.0
    - --port=5000
    - --app-name=basic-auth
    - --workers=1
    image: runtipi-local-learning-mlflow:latest
  postgres:
    image: postgres:15-alpine
    restart: always
    networks:
    - llm-net
    volumes:
    - ${APP_DATA_DIR}/app-data/learning/bind/init-scripts:/docker-entrypoint-initdb.d
    - ${APP_DATA_DIR}/app-data/learning/named/pg:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    networks:
    - llm-net
    volumes:
    - ${APP_DATA_DIR}/app-data/learning/named/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_ENABLE: 'true'
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
    - ${APP_DATA_DIR}/app-data/learning/named/redis:/data
    networks:
    - llm-net
  wandb:
    image: wandb/local
    restart: always
    user: '999:0'
    networks:
    - llm-net
    volumes:
    - ${APP_DATA_DIR}/app-data/learning/named/wandb:/vol/env
    environment:
      WANDB_BASE_URL: http://192.168.1.224:8085
      WANDB_SERVER_ADDRESS: 0.0.0.0
      WANDB_SERVER_LICENSE: eyJhbGciOiJSUzI1NiIsImtpZCI6InUzaHgyQjQyQWhEUXM1M0xQY09yNnZhaTdoSlduYnF1bTRZTlZWd1VwSWM9In0..c3ZB5A2HDmk-XzkxDJ_GYoAUN5jr3RR-7FdbjknA3AWMhHCs-uKjiXWGt1ZbUN54dTqsr8MLQvtggr8gCeHCtf8paRQ9DkW6ty2xsdp6u9zvv5l03y2stjr3cYsSkaCd3-qq0D54PPU16ftuI5df988uBSWp_YIguPvbmhQbO6eoN-gpx_
