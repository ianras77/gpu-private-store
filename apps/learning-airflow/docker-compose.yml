services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ${APP_DATA_DIR}/app-data/learning-airflow/named/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow -d airflow
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.7.1-python3.10
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3220:8080
    volumes:
      - ${APP_DATA_DIR}/app-data/learning-airflow/named/dags:/opt/airflow/dags
      - ${APP_DATA_DIR}/app-data/learning-airflow/named/logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "True"
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Ian}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Rasmussen}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-ian@rasies.com}
      RASSYCODEX_API_BASE: ${AIRFLOW_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      RASSYCODEX_API_KEY: ${AIRFLOW_RASSYCODEX_API_KEY:-${RASSYCODEX_API_KEY:-${AIRFLOW_OPENAI_API_KEY:-}}}
      RASSYCODEX_CHAT_MODEL: ${AIRFLOW_RASSYCODEX_CHAT_MODEL:-rassy-codex}
      RASSYCODEX_CODER_MODEL: ${AIRFLOW_RASSYCODEX_CODER_MODEL:-rassy-codex}
      RASSYCODEX_EMBED_MODEL: ${AIRFLOW_RASSYCODEX_EMBED_MODEL:-rassy-embed}
      OPENAI_API_KEY: ${AIRFLOW_RASSYCODEX_API_KEY:-${RASSYCODEX_API_KEY:-${AIRFLOW_OPENAI_API_KEY:-}}}
      OPENAI_API_BASE: ${AIRFLOW_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      OPENAI_BASE_URL: ${AIRFLOW_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
    extra_hosts:
      - host.docker.internal:host-gateway
    command: >-
      bash -lc "airflow db migrate &&
      (airflow users create
      -u \"$$AIRFLOW_ADMIN_USERNAME\"
      -p \"$$AIRFLOW_ADMIN_PASSWORD\"
      -f \"$$AIRFLOW_ADMIN_FIRSTNAME\"
      -l \"$$AIRFLOW_ADMIN_LASTNAME\"
      -r Admin
      -e \"$$AIRFLOW_ADMIN_EMAIL\" || true) &&
      exec airflow webserver"
    x-runtipi:
      is_main: true
      internal_port: 8080

  scheduler:
    image: apache/airflow:2.7.1-python3.10
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/app-data/learning-airflow/named/dags:/opt/airflow/dags
      - ${APP_DATA_DIR}/app-data/learning-airflow/named/logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "True"
      RASSYCODEX_API_BASE: ${AIRFLOW_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      RASSYCODEX_API_KEY: ${AIRFLOW_RASSYCODEX_API_KEY:-${RASSYCODEX_API_KEY:-${AIRFLOW_OPENAI_API_KEY:-}}}
      RASSYCODEX_CHAT_MODEL: ${AIRFLOW_RASSYCODEX_CHAT_MODEL:-rassy-codex}
      RASSYCODEX_CODER_MODEL: ${AIRFLOW_RASSYCODEX_CODER_MODEL:-rassy-codex}
      RASSYCODEX_EMBED_MODEL: ${AIRFLOW_RASSYCODEX_EMBED_MODEL:-rassy-embed}
      OPENAI_API_KEY: ${AIRFLOW_RASSYCODEX_API_KEY:-${RASSYCODEX_API_KEY:-${AIRFLOW_OPENAI_API_KEY:-}}}
      OPENAI_API_BASE: ${AIRFLOW_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      OPENAI_BASE_URL: ${AIRFLOW_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - airflow
      - scheduler

x-runtipi:
  schema_version: 2
