services:
  postgres:
    image: postgres:15
    container_name: trt-postgres
    environment:
      POSTGRES_USER: trt
      POSTGRES_PASSWORD: trt
      POSTGRES_DB: trt
    ports:
      - "3192:5432"
    volumes:
      - trt-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trt -d trt"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: trt-redis
    ports:
      - "3193:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cheshire-cat:
    image: ghcr.io/cheshire-cat-ai/core:latest
    container_name: trt-cheshire-cat
    ports:
      - "1868:80"
    environment:
      CCAT_DEBUG: "false"
      CCAT_METADATA_FILE: /data/metadata.json
      OLLAMA_GENERAL_BASE_URL: ${OLLAMA_GENERAL_BASE_URL:-http://rassygpt-gateway:8080}
      OLLAMA_EMBED_BASE_URL: ${OLLAMA_EMBED_BASE_URL:-http://rassygpt-gateway:8080}
      OLLAMA_GENERAL_MODEL: ${OLLAMA_GENERAL_MODEL:-rassy-smart}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-rassy-embed}
    networks:
      - default
      - llm-net
    volumes:
      - trt-cat-data:/data
      - ./ops/bootstrap_cat_ollama.py:/app/cat/bootstrap/bootstrap_cat_ollama.py:ro
    command:
      - /bin/sh
      - -lc
      - python3 /app/cat/bootstrap/bootstrap_cat_ollama.py || true; exec python3 -m cat.main
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3191
    container_name: trt-api
    command: sh -lc "pnpm -C apps/api exec prisma migrate deploy && pnpm -C apps/api start"
    environment:
      PORT: "3191"
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://trt:trt@postgres:5432/trt?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3190
      API_URL: http://localhost:3191
      DEV_AUTH_BYPASS: "true"
      OPENAI_ENABLED: "false"
      LOCALAI_BASE_URL: http://rassygpt-gateway:8080/v1
      LOCALAI_API_KEY: ""
      LOCALAI_CHAT_MODEL: qwen3-1.7b
      LOCALAI_MODERATION_MODEL: ibm-granite.granite-4.0-1b
      LOCALAI_EMBED_MODEL: granite-embedding-125m-english
      LOCALAI_TRANSCRIBE_MODEL: whisper-1
      CHESHIRE_CAT_URL: http://cheshire-cat:80
      CHESHIRE_CAT_API_KEY: change_me
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""
      SUPABASE_JWT_SECRET: ""
      OPENAI_API_KEY: ""
      S3_ENDPOINT: ""
      S3_BUCKET: ""
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_REGION: us-east-1
      S3_PUBLIC_URL: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3191:3191"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cheshire-cat:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3191/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3191
    container_name: trt-worker
    command: sh -lc "pnpm -C apps/api start:worker"
    environment:
      DATABASE_URL: postgresql://trt:trt@postgres:5432/trt?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3190
      API_URL: http://localhost:3191
      DEV_AUTH_BYPASS: "true"
      OPENAI_ENABLED: "false"
      LOCALAI_BASE_URL: http://rassygpt-gateway:8080/v1
      LOCALAI_API_KEY: ""
      LOCALAI_CHAT_MODEL: qwen3-1.7b
      LOCALAI_MODERATION_MODEL: ibm-granite.granite-4.0-1b
      LOCALAI_EMBED_MODEL: granite-embedding-125m-english
      LOCALAI_TRANSCRIBE_MODEL: whisper-1
      CHESHIRE_CAT_URL: http://cheshire-cat:80
      CHESHIRE_CAT_API_KEY: change_me
      S3_ENDPOINT: ""
      S3_BUCKET: ""
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_REGION: us-east-1
      S3_PUBLIC_URL: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3191
    container_name: trt-web
    command: sh -lc "pnpm -C apps/web start"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3191
      API_INTERNAL_URL: http://api:3191
    ports:
      - "3190:3190"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3190/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  trt-postgres:
  trt-cat-data:

networks:
  llm-net:
    external: true
    name: ollama_llm-net
