services:
  trt-api:
    build:
      context: ${RUNTIPI_APP_BUILD_ROOT:-${ROOT_FOLDER_HOST}/apps}/${APP_STORE_ID}/web-totallyrighteoustales/repo
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${TRT_PUBLIC_API_URL:-http://${APP_HOST}:${TRT_API_HOST_PORT:-3191}}
    pull_policy: build
    command: sh -lc "pnpm -C apps/api exec prisma migrate deploy && pnpm -C apps/api start"
    environment:
      PORT: "3191"
      HOST: "0.0.0.0"
      DATABASE_URL: ${TRT_DATABASE_URL:-postgresql://trt:trt@trt-postgres:5432/trt?schema=public}
      REDIS_URL: ${TRT_REDIS_URL:-redis://trt-redis:6379}
      APP_URL: ${TRT_PUBLIC_WEB_URL:-http://${APP_HOST}:${APP_PORT:-3190}}
      API_URL: ${TRT_PUBLIC_API_URL:-http://${APP_HOST}:${TRT_API_HOST_PORT:-3191}}
      DEV_AUTH_BYPASS: ${TRT_DEV_AUTH_BYPASS:-true}
      OPENAI_ENABLED: ${TRT_OPENAI_ENABLED:-true}
      LOCALAI_BASE_URL: ${TRT_LOCALAI_BASE_URL:-http://host.docker.internal:8844/v1}
      LOCALAI_API_KEY: ${TRT_LOCALAI_API_KEY:-}
      LOCALAI_CHAT_MODEL: ${TRT_LOCALAI_CHAT_MODEL:-rassy-smart}
      LOCALAI_MODERATION_MODEL: ${TRT_LOCALAI_MODERATION_MODEL:-rassy-fast}
      LOCALAI_EMBED_MODEL: ${TRT_LOCALAI_EMBED_MODEL:-rassy-embed}
      LOCALAI_TRANSCRIBE_MODEL: ${TRT_LOCALAI_TRANSCRIBE_MODEL:-rassy-fast}
      CHESHIRE_CAT_URL: http://trt-cheshire-cat:80
      CHESHIRE_CAT_API_KEY: ${TRT_CHESHIRE_CAT_API_KEY:-change_me}
      SUPABASE_URL: ${TRT_SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${TRT_SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${TRT_SUPABASE_JWT_SECRET:-}
      OPENAI_API_KEY: ${TRT_OPENAI_API_KEY:-}
      S3_ENDPOINT: ${TRT_S3_ENDPOINT:-}
      S3_BUCKET: ${TRT_S3_BUCKET:-}
      S3_ACCESS_KEY: ${TRT_S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${TRT_S3_SECRET_KEY:-}
      S3_REGION: ${TRT_S3_REGION:-us-east-1}
      S3_PUBLIC_URL: ${TRT_S3_PUBLIC_URL:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${TRT_API_HOST_PORT:-3191}:3191
    depends_on:
      trt-postgres:
        condition: service_healthy
      trt-redis:
        condition: service_healthy
      trt-cheshire-cat:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3191/healthz || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    image: runtipi-local-web-totallyrighteoustales-api:latest
    x-runtipi:
      add_to_main_network: true

  trt-cheshire-cat:
    image: ghcr.io/cheshire-cat-ai/core:latest
    environment:
      CCAT_DEBUG: "false"
      CCAT_METADATA_FILE: /data/metadata.json
      OLLAMA_GENERAL_BASE_URL: ${TRT_OLLAMA_GENERAL_BASE_URL:-http://host.docker.internal:8844}
      OLLAMA_EMBED_BASE_URL: ${TRT_OLLAMA_EMBED_BASE_URL:-http://host.docker.internal:8844}
      OLLAMA_GENERAL_MODEL: ${TRT_OLLAMA_GENERAL_MODEL:-rassy-smart}
      OLLAMA_EMBED_MODEL: ${TRT_OLLAMA_EMBED_MODEL:-rassy-embed}
    volumes:
      - ${APP_DATA_DIR}/app-data/web-totallyrighteoustales/named/trt-cat-data:/data
      - ${ROOT_FOLDER_HOST}/apps/${APP_STORE_ID}/web-totallyrighteoustales/repo/ops/bootstrap_cat_ollama.py:/app/cat/bootstrap/bootstrap_cat_ollama.py:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - /bin/sh
      - -lc
      - python3 /app/cat/bootstrap/bootstrap_cat_ollama.py || true; exec python3 -m cat.main
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1', timeout=5)
      interval: 20s
      timeout: 10s
      retries: 18
      start_period: 60s
    x-runtipi:
      add_to_main_network: true

  trt-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: trt
      POSTGRES_PASSWORD: trt
      POSTGRES_DB: trt
    volumes:
      - ${APP_DATA_DIR}/app-data/web-totallyrighteoustales/named/trt-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U trt -d trt
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  trt-redis:
    image: redis:7
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  trt-web:
    build:
      context: ${RUNTIPI_APP_BUILD_ROOT:-${ROOT_FOLDER_HOST}/apps}/${APP_STORE_ID}/web-totallyrighteoustales/repo
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${TRT_PUBLIC_API_URL:-http://${APP_HOST}:${TRT_API_HOST_PORT:-3191}}
    pull_policy: build
    command: sh -lc "pnpm -C apps/web start"
    environment:
      NEXT_PUBLIC_API_URL: ${TRT_PUBLIC_API_URL:-http://${APP_HOST}:${TRT_API_HOST_PORT:-3191}}
      NEXT_PUBLIC_SUPABASE_URL: ${TRT_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${TRT_SUPABASE_ANON_KEY:-}
      API_INTERNAL_URL: http://trt-api:3191
    depends_on:
      trt-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3190/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    image: runtipi-local-web-totallyrighteoustales-web:latest
    x-runtipi:
      is_main: true
      internal_port: 3190

  trt-worker:
    build:
      context: ${RUNTIPI_APP_BUILD_ROOT:-${ROOT_FOLDER_HOST}/apps}/${APP_STORE_ID}/web-totallyrighteoustales/repo
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${TRT_PUBLIC_API_URL:-http://${APP_HOST}:${TRT_API_HOST_PORT:-3191}}
    pull_policy: build
    command: sh -lc "pnpm -C apps/api start:worker"
    environment:
      DATABASE_URL: ${TRT_DATABASE_URL:-postgresql://trt:trt@trt-postgres:5432/trt?schema=public}
      REDIS_URL: ${TRT_REDIS_URL:-redis://trt-redis:6379}
      APP_URL: ${TRT_PUBLIC_WEB_URL:-http://${APP_HOST}:${APP_PORT:-3190}}
      API_URL: ${TRT_PUBLIC_API_URL:-http://${APP_HOST}:${TRT_API_HOST_PORT:-3191}}
      DEV_AUTH_BYPASS: ${TRT_DEV_AUTH_BYPASS:-true}
      OPENAI_ENABLED: ${TRT_OPENAI_ENABLED:-true}
      LOCALAI_BASE_URL: ${TRT_LOCALAI_BASE_URL:-http://host.docker.internal:8844/v1}
      LOCALAI_API_KEY: ${TRT_LOCALAI_API_KEY:-}
      LOCALAI_CHAT_MODEL: ${TRT_LOCALAI_CHAT_MODEL:-rassy-smart}
      LOCALAI_MODERATION_MODEL: ${TRT_LOCALAI_MODERATION_MODEL:-rassy-fast}
      LOCALAI_EMBED_MODEL: ${TRT_LOCALAI_EMBED_MODEL:-rassy-embed}
      LOCALAI_TRANSCRIBE_MODEL: ${TRT_LOCALAI_TRANSCRIBE_MODEL:-rassy-fast}
      CHESHIRE_CAT_URL: http://trt-cheshire-cat:80
      CHESHIRE_CAT_API_KEY: ${TRT_CHESHIRE_CAT_API_KEY:-change_me}
      S3_ENDPOINT: ${TRT_S3_ENDPOINT:-}
      S3_BUCKET: ${TRT_S3_BUCKET:-}
      S3_ACCESS_KEY: ${TRT_S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${TRT_S3_SECRET_KEY:-}
      S3_REGION: ${TRT_S3_REGION:-us-east-1}
      S3_PUBLIC_URL: ${TRT_S3_PUBLIC_URL:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      trt-postgres:
        condition: service_healthy
      trt-redis:
        condition: service_healthy
      trt-api:
        condition: service_healthy
    restart: unless-stopped
    image: runtipi-local-web-totallyrighteoustales-worker:latest
    x-runtipi:
      add_to_main_network: true

x-runtipi:
  schema_version: 2
