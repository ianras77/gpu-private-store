    environment:
      NEXT_PUBLIC_API_BASE: ${ASTRO_PUBLIC_API_BASE:-http://${APP_HOST}:${ASTRO_API_PORT:-3200}}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${ASTRO_SATURNSEER_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}}
      NEXT_PUBLIC_UMAMI_DOMAINS: ${ASTRO_SATURNSEER_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-}}
    command: >
      sh -c "corepack enable
      && until [ -d /repo/node_modules/.pnpm ]; do echo 'waiting for deps'; sleep 2; done
      && pnpm --filter @astro/web-saturnseer exec next build
      && pnpm --filter @astro/web-saturnseer exec next start -p 3000 -H 0.0.0.0"
    depends_on:
      astro-api:
        condition: service_healthy
    ports:
      - ${ASTRO_SATURNSEER_PORT:-3204}:3000
    healthcheck:
      test:
        - CMD-SHELL
