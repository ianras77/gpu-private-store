      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${ASTRO_MALEFICME_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}}
      NEXT_PUBLIC_UMAMI_DOMAINS: ${ASTRO_MALEFICME_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-}}
    command: >
      sh -c "corepack enable
      && until [ -d /repo/node_modules/.pnpm ]; do echo 'waiting for deps'; sleep 2; done
      && pnpm --filter @astro/web-maleficme exec next build
      && pnpm --filter @astro/web-maleficme exec next start -p 3000 -H 0.0.0.0"
    depends_on:
      astro-api:
        condition: service_healthy
    ports:
      - ${ASTRO_MALEFICME_PORT:-3202}:3000
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  astro-web-saturnleo:
    image: node:20-alpine
    working_dir: /repo
    restart: unless-stopped
    init: true
    volumes:
      - ${ROOT_FOLDER_HOST}/apps/${APP_STORE_ID}/web-astro/repo:/repo
    environment:
      NEXT_PUBLIC_API_BASE: ${ASTRO_PUBLIC_API_BASE:-http://${APP_HOST}:${ASTRO_API_PORT:-3200}}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${ASTRO_SATURNLEO_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}}
      NEXT_PUBLIC_UMAMI_DOMAINS: ${ASTRO_SATURNLEO_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-}}
    command: >
      sh -c "corepack enable
      && until [ -d /repo/node_modules/.pnpm ]; do echo 'waiting for deps'; sleep 2; done
      && pnpm --filter @astro/web-saturnleo exec next build
      && pnpm --filter @astro/web-saturnleo exec next start -p 3000 -H 0.0.0.0"
    depends_on:
      astro-api:
        condition: service_healthy
    ports:
      - ${ASTRO_SATURNLEO_PORT:-3203}:3000
    healthcheck:
      test:
