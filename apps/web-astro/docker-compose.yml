      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${ASTRO_ORACLEVEIL_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}}
      NEXT_PUBLIC_UMAMI_DOMAINS: ${ASTRO_ORACLEVEIL_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-}}
    command: >
      sh -c "corepack enable
      && until [ -d /repo/node_modules/.pnpm ]; do echo 'waiting for deps'; sleep 2; done
