services:
  astro-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ASTRO_POSTGRES_USER:-astro}
      POSTGRES_PASSWORD: ${ASTRO_POSTGRES_PASSWORD:-astro}
      POSTGRES_DB: ${ASTRO_POSTGRES_DB:-astro}
    volumes:
      - ${APP_DATA_DIR}/app-data/web-astro/named/astro-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${ASTRO_POSTGRES_USER:-astro} -d ${ASTRO_POSTGRES_DB:-astro}
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  astro-redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/app-data/web-astro/named/astro-redis:/data

  astro-qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/app-data/web-astro/named/astro-qdrant:/qdrant/storage

  astro-api:
    image: astro-api:1.1.0
    pull_policy: build
    build:
      context: /data/apps/web-astrology
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    init: true
    volumes:
      - ${ROOT_FOLDER_HOST}/media/data/web-astro:/esoterica:ro
      - ${APP_DATA_DIR}/app-data/web-astro/named/astro-index:/app-data
    environment:
      PORT: 4020
      HOST: 0.0.0.0
      LOG_LEVEL: ${ASTRO_LOG_LEVEL:-info}
      ASTRO_ENGINE: ${ASTRO_ENGINE:-swiss}
      SWISS_EPHEMERIS_ENABLED: ${SWISS_EPHEMERIS_ENABLED:-true}
      SWISS_EPHEMERIS_PATH: ${SWISS_EPHEMERIS_PATH:-}
      DATABASE_URL: postgresql://${ASTRO_POSTGRES_USER:-astro}:${ASTRO_POSTGRES_PASSWORD:-astro}@astro-postgres:5432/${ASTRO_POSTGRES_DB:-astro}
      REDIS_URL: redis://astro-redis:6379
      QDRANT_URL: http://astro-qdrant:6333
      QDRANT_COLLECTION: ${ASTRO_QDRANT_COLLECTION:-esoterica}
      QDRANT_API_KEY: ${ASTRO_QDRANT_API_KEY:-}
      ESOTERICA_SOURCE_DIR: /esoterica
      ESOTERICA_INDEX_PATH: ${ASTRO_INDEX_PATH:-/app-data/.esoterica-index}
      ESOTERICA_AUDIT_LOG: ${ASTRO_AUDIT_LOG_ENABLED:-1}
      ESOTERICA_AUDIT_LOG_PATH: ${ASTRO_AUDIT_LOG_PATH:-/app-data/.esoterica-index/lore-audit.jsonl}
      ESOTERICA_ADMIN_TOKEN: ${ASTRO_ESOTERICA_ADMIN_TOKEN:-}
      ESOTERICA_AUTO_REFRESH: ${ASTRO_AUTO_REFRESH:-1}
      ESOTERICA_REFRESH_ON_START: ${ASTRO_REFRESH_ON_START:-1}
      ESOTERICA_REFRESH_HOURS: ${ASTRO_REFRESH_HOURS:-24}
      ESOTERICA_ROTATE_DAILY: ${ASTRO_ROTATE_DAILY:-1}
      ESOTERICA_STRICT_BRAND_FILTER: ${ASTRO_STRICT_BRAND_FILTER:-0}
      ALLOW_DEV_AUTH: ${ASTRO_ALLOW_DEV_AUTH:-true}
      DEV_USER_EMAIL: ${ASTRO_DEV_USER_EMAIL:-ian@rasies.com}
      DEV_USER_NAME: ${ASTRO_DEV_USER_NAME:-Ian}
      ASTRO_RASSYMIND_ENABLED: ${ASTRO_RASSYMIND_ENABLED:-1}
      ASTRO_LEGACY_LLM_ENABLED: ${ASTRO_LEGACY_LLM_ENABLED:-0}
      RASSYMIND_API_KEY: ${ASTRO_RASSYMIND_API_KEY:-${RASSYMIND_API_KEY:-}}
      RASSYMIND_CAPABILITIES_JSON: ${RASSYMIND_CAPABILITIES_JSON:-}
      RASSYMIND_BASE_URL: ${ASTRO_RASSYMIND_BASE_URL:-${RASSYMIND_BASE_URL:-http://host.docker.internal:8844/v1}}
      ASTRO_RASSYMIND_FAST_MODEL: ${ASTRO_RASSYMIND_FAST_MODEL:-rassy-fast}
      ASTRO_RASSYMIND_MIND_MODEL: ${ASTRO_RASSYMIND_MIND_MODEL:-rassy-mind}
      ASTRO_REPORT_MAX_PARALLEL_STEPS: ${ASTRO_REPORT_MAX_PARALLEL_STEPS:-2}
      ASTRO_REPORT_MAX_MODEL_CALLS: ${ASTRO_REPORT_MAX_MODEL_CALLS:-24}
      ASTRO_REPORT_MAX_TOOL_CALLS: ${ASTRO_REPORT_MAX_TOOL_CALLS:-48}
      ESOTERICA_EMBED_BASE_URL: ${ASTRO_RASSYMIND_BASE_URL:-${RASSYMIND_BASE_URL:-http://host.docker.internal:8844}/v1}
      ESOTERICA_EMBED_MODEL: ${ASTRO_EMBED_MODEL:-rassy-embed}
      MAPBOX_TOKEN: ${ASTRO_MAPBOX_TOKEN:-}
      OPENCAGE_KEY: ${ASTRO_OPENCAGE_KEY:-}
      NOMINATIM_BASE_URL: ${ASTRO_NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${ASTRO_NOMINATIM_USER_AGENT:-astro-multibrand/1.0}
      NOMINATIM_CONTACT_EMAIL: ${ASTRO_NOMINATIM_CONTACT_EMAIL:-ian@rasies.com}
      NOMINATIM_MAX_RPS: ${ASTRO_NOMINATIM_MAX_RPS:-1}
      GEO_PROVIDER_ALLOW_NOMINATIM_IN_PROD: ${ASTRO_ALLOW_NOMINATIM_IN_PROD:-0}
      GEO_RATE_LIMIT_MAX: ${ASTRO_GEO_RATE_LIMIT_MAX:-90}
      GEO_RATE_LIMIT_WINDOW_MS: ${ASTRO_GEO_RATE_LIMIT_WINDOW_MS:-60000}
      READING_RATE_LIMIT_MAX: ${ASTRO_READING_RATE_LIMIT_MAX:-20}
      READING_RATE_LIMIT_WINDOW_MS: ${ASTRO_READING_RATE_LIMIT_WINDOW_MS:-60000}
    depends_on:
      astro-postgres:
        condition: service_healthy
      astro-redis:
        condition: service_started
      astro-qdrant:
        condition: service_started
    ports:
      - ${ASTRO_API_PORT:-3200}:4020
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4020/healthz').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    x-runtipi:
      add_to_main_network: true

  astro-web-jupiterseek:
    image: astro-web-jupiterseek:1.1.0
    pull_policy: build
    build:
      context: /data/apps/web-astrology
      dockerfile: infra/Dockerfile.web
      args:
        APP_NAME: "@astro/web-jupiterseek"
        NEXT_PUBLIC_API_BASE: http://astro-api:4020
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${ASTRO_JUPITERSEEK_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-3d8e5d02-c69b-4e25-8c49-8d1b05c35e8b}}
        NEXT_PUBLIC_UMAMI_DOMAINS: ${ASTRO_JUPITERSEEK_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-jupiterseek.com}}
    restart: unless-stopped
    init: true
    depends_on:
      astro-api:
        condition: service_healthy
    ports:
      - ${ASTRO_JUPITERSEEK_PORT:-3201}:3000
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    x-runtipi:
      is_main: true
      internal_port: 3000

  astro-web-maleficme:
    image: astro-web-maleficme:1.1.0
    pull_policy: build
    build:
      context: /data/apps/web-astrology
      dockerfile: infra/Dockerfile.web
      args:
        APP_NAME: "@astro/web-maleficme"
        NEXT_PUBLIC_API_BASE: http://astro-api:4020
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${ASTRO_MALEFICME_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-096aaadf-56c3-46e8-bd89-1634205a4c2c}}
        NEXT_PUBLIC_UMAMI_DOMAINS: ${ASTRO_MALEFICME_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-maleficme.com}}
    restart: unless-stopped
    init: true
    depends_on:
      astro-api:
        condition: service_healthy
    ports:
      - ${ASTRO_MALEFICME_PORT:-3202}:3000
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  astro-web-saturnleo:
    image: astro-web-saturnleo:1.1.0
    pull_policy: build
    build:
      context: /data/apps/web-astrology
      dockerfile: infra/Dockerfile.web
      args:
        APP_NAME: "@astro/web-saturnleo"
        NEXT_PUBLIC_API_BASE: http://astro-api:4020
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${ASTRO_SATURNLEO_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-e80b376f-76fe-4dec-9cd2-9943608550c2}}
        NEXT_PUBLIC_UMAMI_DOMAINS: ${ASTRO_SATURNLEO_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-saturnleo.com}}
    restart: unless-stopped
    init: true
    depends_on:
      astro-api:
        condition: service_healthy
    ports:
      - ${ASTRO_SATURNLEO_PORT:-3203}:3000
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  astro-web-saturnseer:
    image: astro-web-saturnseer:1.1.0
    pull_policy: build
    build:
      context: /data/apps/web-astrology
      dockerfile: infra/Dockerfile.web
      args:
        APP_NAME: "@astro/web-saturnseer"
        NEXT_PUBLIC_API_BASE: http://astro-api:4020
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${ASTRO_SATURNSEER_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-4534d087-5126-4b56-8b3e-e02870a9ddc1}}
        NEXT_PUBLIC_UMAMI_DOMAINS: ${ASTRO_SATURNSEER_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-saturnseer.com}}
    restart: unless-stopped
    init: true
    depends_on:
      astro-api:
        condition: service_healthy
    ports:
      - ${ASTRO_SATURNSEER_PORT:-3204}:3000
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  astro-web-oracleveil:
    image: astro-web-oracleveil:1.1.0
    pull_policy: build
    build:
      context: /data/apps/web-astrology
      dockerfile: infra/Dockerfile.web
      args:
        APP_NAME: "@astro/web-oracleveil"
        NEXT_PUBLIC_API_BASE: http://astro-api:4020
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-https://umami.rasies.com/script.js}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${ASTRO_ORACLEVEIL_UMAMI_WEBSITE_ID:-${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-ce6ce25c-828e-4661-bde0-bf0f8bcfd427}}
        NEXT_PUBLIC_UMAMI_DOMAINS: ${ASTRO_ORACLEVEIL_UMAMI_DOMAINS:-${NEXT_PUBLIC_UMAMI_DOMAINS:-oracleveil.com}}
    restart: unless-stopped
    init: true
    depends_on:
      astro-api:
        condition: service_healthy
    ports:
      - ${ASTRO_ORACLEVEIL_PORT:-3205}:3000
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

x-runtipi:
  schema_version: 2
