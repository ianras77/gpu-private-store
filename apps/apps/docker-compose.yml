services:
  apps-supervisor:
    image: docker:29-cli
    restart: unless-stopped
    working_dir: /data/apps
    environment:
      APPS_MODE: web
      APPS_PREFIX: web-
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /data/apps:/data/apps
    entrypoint:
    - /bin/sh
    - /data/apps/ops/compose-supervisor.sh
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/apps-supervisor.ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20m
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
