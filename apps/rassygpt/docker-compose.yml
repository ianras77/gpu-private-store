x-runtipi:
  schema_version: 2

services:
  rassygpt-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: runtipi-local-rassygpt-gateway:0.2.0
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      RASSYGPT_API_KEY: ${RASSYGPT_API_KEY}
      RASSYGPT_REQUIRE_AUTH: ${RASSYGPT_REQUIRE_AUTH}
      RASSYGPT_GATEWAY_WORKERS: ${RASSYGPT_GATEWAY_WORKERS}
      RASSYGPT_GATEWAY_LIMIT_CONCURRENCY: ${RASSYGPT_GATEWAY_LIMIT_CONCURRENCY}
      RASSYGPT_CONFIG_FILE: /data/config/routes.yaml
      RASSYGPT_QDRANT_URL: ${RASSYGPT_QDRANT_URL}
      RASSYGPT_IMAGE_BACKEND_URL: ${RASSYGPT_IMAGE_BACKEND_URL}
      RASSYGPT_AUDIO_BACKEND_URL: ${RASSYGPT_AUDIO_BACKEND_URL}
      RASSYGPT_GENERAL_URL: http://rassygpt-general:8080
      RASSYGPT_CODER_URL: http://rassygpt-coder:8080
      RASSYGPT_CODER_SECONDARY_URL: http://rassygpt-coder-secondary:8000
      RASSYGPT_FAST_URL: http://rassygpt-fast:8080
      RASSYGPT_EMBED_URL: http://rassygpt-embed:8080
      RASSYGPT_RERANK_URL: http://rassygpt-rerank:8080
    volumes:
      - ${APP_DATA_DIR}/gateway:/data
    depends_on:
      rassygpt-qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    x-runtipi:
      is_main: true
      internal_port: 8080
      add_to_main_network: true
    labels:
      traefik.http.middlewares.rassygpt-compress.compress: "true"
      traefik.http.middlewares.rassygpt-secure-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.rassygpt-secure-headers.headers.browserXssFilter: "true"
      traefik.http.middlewares.rassygpt-secure-headers.headers.contentTypeNosniff: "true"
      traefik.http.routers.rassygpt.middlewares: "rassygpt-compress,rassygpt-secure-headers"

  rassygpt-general:
    image: ${RASSYGPT_LLAMA_IMAGE}
    restart: unless-stopped
    runtime: nvidia
    environment:
      TZ: ${TZ}
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${RASSYGPT_GPU_GENERAL}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${RASSYGPT_FAST_STORAGE_DIR}/llama-cache:/root/.cache
      - ${RASSYGPT_FAST_STORAGE_DIR}/general:/models
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --hf-repo
      - ${RASSYGPT_GENERAL_REPO}
      - --hf-file
      - ${RASSYGPT_GENERAL_FILE}
      - -c
      - "32768"
      - -np
      - "2"
      - -ngl
      - "999"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 45s
      timeout: 10s
      retries: 20
      start_period: 5m

  rassygpt-coder:
    image: ${RASSYGPT_LLAMA_IMAGE}
    restart: unless-stopped
    runtime: nvidia
    environment:
      TZ: ${TZ}
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${RASSYGPT_GPU_CODER}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${RASSYGPT_FAST_STORAGE_DIR}/llama-cache:/root/.cache
      - ${RASSYGPT_FAST_STORAGE_DIR}/coder:/models
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --hf-repo
      - ${RASSYGPT_CODER_REPO}
      - --hf-file
      - ${RASSYGPT_CODER_FILE}
      - -c
      - "32768"
      - -np
      - "2"
      - -ngl
      - "999"
      - --split-mode
      - layer
      - --tensor-split
      - 1,1
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 45s
      timeout: 10s
      retries: 20
      start_period: 5m

  rassygpt-fast:
    image: ${RASSYGPT_LLAMA_IMAGE}
    restart: unless-stopped
    runtime: nvidia
    environment:
      TZ: ${TZ}
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${RASSYGPT_GPU_FAST}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${RASSYGPT_FAST_STORAGE_DIR}/llama-cache:/root/.cache
      - ${RASSYGPT_FAST_STORAGE_DIR}/fast:/models
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --hf-repo
      - ${RASSYGPT_FAST_REPO}
      - --hf-file
      - ${RASSYGPT_FAST_FILE}
      - -c
      - "16384"
      - -np
      - "4"
      - -ngl
      - "999"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 45s
      timeout: 10s
      retries: 20
      start_period: 5m

  rassygpt-coder-secondary:
    image: ${RASSYGPT_VLLM_IMAGE}
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    environment:
      TZ: ${TZ}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_XET: "true"
      NVIDIA_VISIBLE_DEVICES: ${RASSYGPT_GPU_CODER_SECONDARY}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${RASSYGPT_FAST_STORAGE_DIR}/vllm-cache:/root/.cache/huggingface
    command:
      - --model
      - ${RASSYGPT_CODER_SECONDARY_MODEL}
      - --served-model-name
      - rassy-coder-secondary
      - --trust-remote-code
      - --quantization
      - bitsandbytes
      - --load-format
      - bitsandbytes
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - half
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.86"
      - --max-num-seqs
      - "1"
      - --download-dir
      - /root/.cache/huggingface
      - --enable-prefix-caching
      - --disable-log-requests
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 45s
      timeout: 10s
      retries: 20
      start_period: 15m

  rassygpt-embed:
    image: ${RASSYGPT_LLAMA_IMAGE}
    restart: unless-stopped
    runtime: nvidia
    environment:
      TZ: ${TZ}
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${RASSYGPT_GPU_RETRIEVAL}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${RASSYGPT_FAST_STORAGE_DIR}/llama-cache:/root/.cache
      - ${RASSYGPT_FAST_STORAGE_DIR}/embed:/models
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --hf-repo
      - ${RASSYGPT_EMBED_REPO}
      - --hf-file
      - ${RASSYGPT_EMBED_FILE}
      - -c
      - "8192"
      - -b
      - "8192"
      - -ub
      - "1024"
      - -ngl
      - "999"
      - --embeddings
      - --pooling
      - mean
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 45s
      timeout: 10s
      retries: 20
      start_period: 5m

  rassygpt-rerank:
    image: ${RASSYGPT_LLAMA_IMAGE}
    restart: unless-stopped
    runtime: nvidia
    environment:
      TZ: ${TZ}
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${RASSYGPT_GPU_RETRIEVAL}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${RASSYGPT_FAST_STORAGE_DIR}/llama-cache:/root/.cache
      - ${RASSYGPT_FAST_STORAGE_DIR}/rerank:/models
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --hf-repo
      - ${RASSYGPT_RERANK_REPO}
      - --hf-file
      - ${RASSYGPT_RERANK_FILE}
      - -c
      - "2048"
      - -np
      - "2"
      - -ngl
      - "999"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 45s
      timeout: 10s
      retries: 20
      start_period: 5m

  rassygpt-qdrant:
    image: ${RASSYGPT_QDRANT_IMAGE}
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - ${RASSYGPT_FAST_STORAGE_DIR}/qdrant/storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    x-runtipi:
      add_to_main_network: true
      internal_port: 6333

  rassygpt-localai-media:
    image: ${RASSYGPT_LOCALAI_IMAGE}
    restart: unless-stopped
    runtime: nvidia
    environment:
      TZ: ${TZ}
      NVIDIA_VISIBLE_DEVICES: ${RASSYGPT_GPU_MEDIA}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LOCALAI_MODELS_PATH: /models
      LOCALAI_GENERATED_CONTENT_PATH: /generated
      LOCALAI_UPLOAD_PATH: /uploads
      LOCALAI_DISABLE_WEBUI: "true"
      LOCALAI_LOG_LEVEL: info
    volumes:
      - ${RASSYGPT_FAST_STORAGE_DIR}/localai/models:/models
      - ${RASSYGPT_FAST_STORAGE_DIR}/localai/generated:/generated
      - ${RASSYGPT_FAST_STORAGE_DIR}/localai/uploads:/uploads
      - ${RASSYGPT_FAST_STORAGE_DIR}/localai/data:/data
    command:
      - run
      - localai@${RASSYGPT_IMAGE_MODEL}
      - localai@${RASSYGPT_STT_MODEL}
      - localai@${RASSYGPT_TTS_MODEL}
      - --address
      - :8080
      - --models-path
      - /models
      - --generated-content-path
      - /generated
      - --data-path
      - /data
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 45s
      timeout: 10s
      retries: 40
      start_period: 30m
