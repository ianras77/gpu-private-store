server:
  name: RassyGPT
  version: "1.0.0"
  require_auth: ${RASSYGPT_REQUIRE_AUTH:-true}
  qdrant_url: ${RASSYGPT_QDRANT_URL:-http://rassygpt-qdrant:6333}

defaults:
  chat: rassy-smart
  completions: rassy-general
  embeddings: rassy-embed
  rerank: rassy-rerank
  images: rassy-image
  audio: rassy-audio

backends:
  general:
    type: openai
    base_url: ${RASSYGPT_GENERAL_URL:-http://rassygpt-general:8080}
    health_path: /health
  coder:
    type: openai
    base_url: ${RASSYGPT_CODER_URL:-http://rassygpt-coder:8080}
    health_path: /health
  coder_secondary:
    type: openai
    base_url: ${RASSYGPT_CODER_SECONDARY_URL:-http://rassygpt-coder-secondary:8000}
    health_path: /health
  fast:
    type: openai
    base_url: ${RASSYGPT_FAST_URL:-http://rassygpt-fast:8080}
    health_path: /health
  embed:
    type: openai
    base_url: ${RASSYGPT_EMBED_URL:-http://rassygpt-embed:8080}
    health_path: /health
  rerank:
    type: rerank
    base_url: ${RASSYGPT_RERANK_URL:-http://rassygpt-rerank:8080}
    health_path: /health
    path: /v1/rerank
  image:
    type: openai-image
    base_url: ${RASSYGPT_IMAGE_BACKEND_URL:-}
    health_path: /readyz
  audio:
    type: openai-audio
    base_url: ${RASSYGPT_AUDIO_BACKEND_URL:-}
    health_path: /readyz

models:
  rassy-smart:
    kind: chat
    backend: smart
    upstream_model: rassy-smart
    description: Smart default router that chooses chat, coder, secondary coder, or fast utility lanes.
  rassy-general:
    kind: chat
    backend: general
    upstream_model: rassy-general
    description: General-purpose 30B-class Qwen3 instruct model on GPU 7, V100 32GB.
  rassy-coder:
    kind: chat
    backend: coder
    upstream_model: rassy-coder
    description: Coding specialist on GPUs 0 and 2, dual V100 16GB.
  rassy-coder-secondary:
    kind: chat
    backend: coder_secondary
    upstream_model: rassy-coder-secondary
    description: Secondary coder worker on the V100 12GB lane.
  rassy-fast:
    kind: chat
    backend: fast
    upstream_model: rassy-fast
    description: Fast utility model on the P40 24GB lane.
  rassy-embed:
    kind: embeddings
    backend: embed
    upstream_model: rassy-embed
    description: Embeddings service on GPU 5, P100 16GB.
  rassy-rerank:
    kind: rerank
    backend: rerank
    upstream_model: rassy-rerank
    description: Reranker service on GPU 5, with embedding-cosine fallback.
  rassy-image:
    kind: images
    backend: image
    upstream_model: ${RASSYGPT_IMAGE_MODEL:-flux.2-klein-4b}
    description: LocalAI image lane on the RTX 2080 Ti.
  rassy-audio:
    kind: audio
    backend: audio
    upstream_model: ${RASSYGPT_STT_MODEL:-whisper-large-turbo-q8_0}
    tts_model: ${RASSYGPT_TTS_MODEL:-qwen3-tts-cpp}
    description: LocalAI STT/TTS lane on the RTX 2080 Ti.

aliases:
  gpt-4o-mini: rassy-fast
  gpt-4o: rassy-smart
  o4-mini: rassy-smart
  coder: rassy-coder
  coder-secondary: rassy-coder-secondary
  rassy-worker: rassy-coder-secondary
  embedding: rassy-embed
  text-embedding-3-small: rassy-embed
  text-embedding-3-large: rassy-embed
