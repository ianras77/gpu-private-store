services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ${APP_DATA_DIR}/app-data/learning-mlflow/named/postgres:/var/lib/postgresql/data
      - ./init/create_dbs.sql:/docker-entrypoint-initdb.d/10-create-dbs.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    image: runtipi-local-learning-mlflow:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3221:5000
    volumes:
      - ${APP_DATA_DIR}/app-data/learning-mlflow/named/mlflow:/mlflow
    environment:
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${LEARNING_MLFLOW_SECRET_KEY:-Mycobacteri@98}
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
      MLFLOW_ARTIFACT_ROOT: /mlflow
      MLFLOW_AUTH_CONFIG_PATH: /tmp/basic_auth.ini
      MLFLOW_AUTH_DATABASE_URI: postgresql+psycopg2://postgres:postgres@postgres:5432/mlflowauth
      MLFLOW_ADMIN_USERNAME: ${MLFLOW_ADMIN_USERNAME:-ian}
      MLFLOW_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:-Mycobacteri@98}
      MLFLOW_DEFAULT_PERMISSION: ${MLFLOW_DEFAULT_PERMISSION:-READ}
      RASSYCODEX_API_BASE: ${MLFLOW_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      RASSYCODEX_API_KEY: ${MLFLOW_RASSYCODEX_API_KEY:-${RASSYCODEX_API_KEY:-${MLFLOW_OPENAI_API_KEY:-}}}
      RASSYCODEX_CHAT_MODEL: ${MLFLOW_RASSYCODEX_CHAT_MODEL:-rassy-codex}
      RASSYCODEX_EMBED_MODEL: ${MLFLOW_RASSYCODEX_EMBED_MODEL:-rassy-embed}
      OPENAI_API_KEY: ${MLFLOW_RASSYCODEX_API_KEY:-${RASSYCODEX_API_KEY:-${MLFLOW_OPENAI_API_KEY:-}}}
      OPENAI_API_BASE: ${MLFLOW_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      OPENAI_BASE_URL: ${MLFLOW_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - server
      - --host=0.0.0.0
      - --port=5000
      - --app-name=basic-auth
      - --workers=1
    x-runtipi:
      is_main: true
      internal_port: 5000

x-runtipi:
  schema_version: 2
