services:
  crewai:
    build:
      context: ./crewai
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
    - crewai-qdrant
    environment:
      RASSYCODEX_API_BASE: ${CREWAI_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      RASSYCODEX_API_KEY: ${CREWAI_RASSYCODEX_API_KEY:-${RASSYCODEX_API_KEY:-${CREWAI_LOCALAI_API_KEY:-}}}
      RASSYCODEX_CHAT_MODEL: ${CREWAI_RASSYCODEX_CHAT_MODEL:-rassy-codex}
      RASSYCODEX_CODER_MODEL: ${CREWAI_RASSYCODEX_CODER_MODEL:-rassy-codex}
      RASSYCODEX_EMBED_MODEL: ${CREWAI_RASSYCODEX_EMBED_MODEL:-rassy-embed}
      RASSYCODEX_RERANK_MODEL: ${CREWAI_RASSYCODEX_RERANK_MODEL:-rassy-rerank}
      RASSYCODEX_IMAGE_MODEL: ${CREWAI_RASSYCODEX_IMAGE_MODEL:-rassy-image}
      OPENAI_API_BASE: ${CREWAI_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      OPENAI_BASE_URL: ${CREWAI_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      OPENAI_API_KEY: ${CREWAI_RASSYCODEX_API_KEY:-${RASSYCODEX_API_KEY:-${CREWAI_LOCALAI_API_KEY:-}}}
      LOCALAI_API_BASE: ${CREWAI_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      LOCALAI_API_KEY: ${CREWAI_RASSYCODEX_API_KEY:-${RASSYCODEX_API_KEY:-${CREWAI_LOCALAI_API_KEY:-}}}
      LOCALAI_LLM_MODEL: ${CREWAI_RASSYCODEX_CHAT_MODEL:-rassy-codex}
      LOCALAI_EMBED_MODEL: ${CREWAI_RASSYCODEX_EMBED_MODEL:-rassy-embed}
      LOCALAI_RERANK_MODEL: ${CREWAI_RASSYCODEX_RERANK_MODEL:-rassy-rerank}
      LOCALAI_IMAGE_MODEL: ${CREWAI_RASSYCODEX_IMAGE_MODEL:-rassy-image}
      QDRANT_URL: ${CREWAI_QDRANT_URL:-http://crewai-qdrant:6333}
      QDRANT_COLLECTION: ${CREWAI_QDRANT_COLLECTION:-qdrant_docs}
      JUPYTERHUB_USERS: ${CREWAI_JUPYTERHUB_USERS:-ian:Mycobacteri@98}
      JUPYTERHUB_ADMIN_USERS: ${CREWAI_JUPYTERHUB_ADMIN_USERS:-ian}
      PYTHONUNBUFFERED: '1'
      CREWAI_TELEMETRY_ENABLED: 'false'
      OLLAMA_BASE_URL: ${CREWAI_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      OLLAMA_MODEL: ${CREWAI_RASSYCODEX_CODER_MODEL:-rassy-codex}
    volumes:
    - ${APP_DATA_DIR}/app-data/crewai/named/workspace:/workspace
    - ${APP_DATA_DIR}/app-data/crewai/named/audio-library:/workspace/audio_library
    - ${APP_DATA_DIR}/app-data/crewai/named/outputs:/workspace/outputs
    - ${APP_DATA_DIR}/app-data/crewai/named/jupyterhub:/data/jupyterhub
    - /var/run/docker.sock:/var/run/docker.sock
    - ./jupyterhub/jupyterhub_config.py:/etc/jupyterhub/jupyterhub_config.py:ro
    - ./start-jupyterhub.sh:/usr/local/bin/start-jupyterhub.sh:ro
    working_dir: /workspace
    extra_hosts:
    - host.docker.internal:host-gateway
    expose:
    - '8888'
    command:
    - /usr/local/bin/start-jupyterhub.sh
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/hub/login', timeout=5)
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    image: runtipi-local-crewai-crewai:latest
    pull_policy: build
    x-runtipi:
      is_main: true
      internal_port: 8888
  crewai-qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/app-data/crewai/named/qdrant:/qdrant/storage
x-runtipi:
  schema_version: 2
