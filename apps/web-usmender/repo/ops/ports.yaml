app:
  name: web-usmender
  type: web+api
  runtime: node
services:
  - name: web
    port: 3294
    protocol: http
    purpose: "Primary web UI"
    health: "/"
  - name: api
    port: 3295
    protocol: http
    purpose: "Backend API"
    health: "/healthz"
  - name: db
    port: 3297
    protocol: tcp
    purpose: "Postgres"
notes:
  - "Contiguous app block: 3294-3297."
  - "Cheshire Cat is optional and lives in docker-compose.ai.yml."
env:
  required:
    - PORT
  optional:
    - NEXT_PUBLIC_API_URL
