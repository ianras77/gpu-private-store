services:
  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: labelstudio
      POSTGRES_PASSWORD: labelstudio
      POSTGRES_DB: labelstudio
    volumes:
      - ${APP_DATA_DIR}/app-data/learning-label-studio/named/postgres:/var/lib/postgresql/data

  labelstudio:
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - 3222:8080
    volumes:
      - ${APP_DATA_DIR}/app-data/learning-label-studio/named/data:/label-studio/data
    environment:
      DATABASE_URL: postgresql://labelstudio:labelstudio@db:5432/labelstudio
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST:-http://192.168.1.162:3222}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://192.168.1.162:3222}
      RASSYCODEX_API_BASE: ${LABEL_STUDIO_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      RASSYCODEX_API_KEY: ${LABEL_STUDIO_RASSYCODEX_API_KEY:-${RASSYCODEX_API_KEY:-${LABEL_STUDIO_OPENAI_API_KEY:-}}}
      RASSYCODEX_CHAT_MODEL: ${LABEL_STUDIO_RASSYCODEX_CHAT_MODEL:-rassy-general}
      RASSYCODEX_EMBED_MODEL: ${LABEL_STUDIO_RASSYCODEX_EMBED_MODEL:-rassy-embed}
      OPENAI_API_KEY: ${LABEL_STUDIO_RASSYCODEX_API_KEY:-${RASSYCODEX_API_KEY:-${LABEL_STUDIO_OPENAI_API_KEY:-}}}
      OPENAI_API_BASE: ${LABEL_STUDIO_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
      OPENAI_BASE_URL: ${LABEL_STUDIO_RASSYCODEX_API_BASE:-${RASSYCODEX_API_BASE:-http://host.docker.internal:8844/v1}}
    extra_hosts:
      - host.docker.internal:host-gateway
    x-runtipi:
      is_main: true
      internal_port: 8080

x-runtipi:
  schema_version: 2
